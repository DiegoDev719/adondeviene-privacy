<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="A donde viene — aplicación móvil de movilidad para Santiago de Chile." />
  <title>A donde viene</title>
  <style>
    :root {
      --bg: #0B0F17;
      --text: #E7ECF3;
      --text-secondary: #9CAABF;
      --accent: #16A34A;
    }

    @media (prefers-color-scheme: light) {
      :root {
        --bg: #F5F7FA;
        --text: #111827;
        --text-secondary: #4B5563;
        --accent: #15803D;
      }
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }

    .card {
      max-width: 520px;
      width: 100%;
      text-align: center;
    }

    .brand-mark {
      width: 72px;
      height: 72px;
      border-radius: 20px;
      background: linear-gradient(135deg, #16A34A, #0EA5E9);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      font-weight: 800;
      color: #FFFFFF;
      margin: 0 auto 24px;
    }

    h1 {
      font-size: 30px;
      font-weight: 800;
      letter-spacing: -0.02em;
      margin-bottom: 12px;
    }

    p {
      font-size: 15px;
      color: var(--text-secondary);
      margin-bottom: 32px;
    }

    a {
      display: inline-block;
      color: #FFFFFF;
      background: var(--accent);
      text-decoration: none;
      font-weight: 700;
      font-size: 15px;
      padding: 14px 28px;
      border-radius: 999px;
      transition: transform 0.12s ease, filter 0.12s ease;
    }

    a:hover {
      filter: brightness(1.08);
      transform: translateY(-1px);
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="brand-mark" aria-hidden="true">A</div>
    <h1>A donde viene</h1>
    <p>Tu aplicación de movilidad para Santiago de Chile.</p>
    <a href="privacy.html">Política de Privacidad</a>
  </div>
</body>
</html>
